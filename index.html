<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Warm the connections AdSense's loader script actually uses (checked
      against a real Lighthouse trace — see git history for this line).
      googleads.g.doubleclick.net and tpc.googlesyndication.com were
      dropped after Lighthouse reported them as unused preconnects (no ad
      slots are configured yet, so the deeper ad-serving/creative hosts
      are never hit); fundingchoicesmessages.google.com was added after
      Lighthouse flagged it as a real ~80ms LCP opportunity — it's
      Google's consent-management script, auto-loaded by the AdSense
      loader itself, not something we invoke directly. Re-check this list
      against a real trace if ad behavior changes (e.g. once real slot
      IDs are added) rather than assuming it's still accurate.
    -->
    <link rel="preconnect" href="https://pagead2.googlesyndication.com" crossorigin />
    <link rel="dns-prefetch" href="https://pagead2.googlesyndication.com" />
    <link rel="preconnect" href="https://fundingchoicesmessages.google.com" />
    <link rel="dns-prefetch" href="https://fundingchoicesmessages.google.com" />
    <!--
      Google AdSense loader, deferred to `window.load` instead of fetched
      immediately (2026-09-28 Lighthouse mobile run: this ~289 KiB script
      chain -- loader + impl + consent -- was competing with our own
      content for bandwidth during the LCP window, for zero ad revenue
      since no ad slot IDs are configured yet). Accepted trade-off: the
      literal <script src="...pagead2...adsbygoogle.js..."> tag AdSense's
      setup instructions ask for is no longer present verbatim in the raw
      HTML -- if this site is mid-way through Google's site-verification/
      account-approval flow and that stalls or fails, revert to a plain
      static tag (see git history for this block) until approval is
      confirmed, then re-defer.

      Present on every page (prerender.ts only rewrites title/description/
      canonical/og/twitter tags — see writePage() — so this survives
      untouched into every prerendered route). The dedup guard here
      matches src/lib/adsense.ts's ensureAdSenseScript(): whichever of the
      two runs first (this, on window.load — or an ad component mounting
      sooner via useEffect) wins, and the other becomes a no-op, so ads
      still work correctly regardless of load timing once real slot IDs
      exist. Client ID must stay in sync with VITE_ADSENSE_CLIENT_ID in
      .env.production (src/config/ads.ts is the single source of truth
      for every other consumer).
    -->
    <script>
      (function () {
        function loadAdSense() {
          if (document.querySelector('script[data-adsbygoogle-loader="true"]')) return;
          var s = document.createElement("script");
          s.async = true;
          s.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6133117250071116";
          s.crossOrigin = "anonymous";
          s.setAttribute("data-adsbygoogle-loader", "true");
          document.head.appendChild(s);
        }
        if (document.readyState === "complete") {
          loadAdSense();
        } else {
          window.addEventListener("load", loadAdSense);
        }
      })();
    </script>
    <!--
      This <head> is the CSR fallback for the root document, replaced at
      runtime per-route by <SeoHead> (src/components/seo/SeoHead.tsx) via
      react-helmet-async, and replaced per-route at build time for static
      hosting by scripts/prerender.ts — see that file for why a build-time
      static <head> (and body content) matters for non-JS crawlers/bots.
    -->
    <title>Toolkit4Me — Free Tools for Everyday Digital Tasks</title>
    <meta
      name="description"
      content="Toolkit4Me provides free online tools for everyday digital tasks, including PDF conversion, image conversion, compression and OCR."
    />
    <link rel="canonical" href="https://toolkit4me.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Toolkit4Me" />
    <meta property="og:title" content="Toolkit4Me — Free Tools for Everyday Digital Tasks" />
    <meta
      property="og:description"
      content="Toolkit4Me provides free online tools for everyday digital tasks, including PDF conversion, image conversion, compression and OCR."
    />
    <meta property="og:url" content="https://toolkit4me.com/" />
    <meta property="og:image" content="https://toolkit4me.com/og-default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@toolkit4me" />
    <meta name="twitter:title" content="Toolkit4Me — Free Tools for Everyday Digital Tasks" />
    <meta
      name="twitter:description"
      content="Toolkit4Me provides free online tools for everyday digital tasks, including PDF conversion, image conversion, compression and OCR."
    />
    <meta name="twitter:image" content="https://toolkit4me.com/og-default.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Illustration: a chain of browser-based tools — resize, compress, convert to PDF, share — inside the boundary of your device"><title>Illustration: a chain of browser-based tools — resize, compress, convert to PDF, share — inside the boundary of your device</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef2ff"/><stop offset="1" stop-color="#fdf2f8"/></linearGradient>
<linearGradient id="brandg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#db2777"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#12142a" flood-opacity="0.12"/></filter>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="24" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#343a4c"/></marker>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="96" cy="94.5" r="113.39999999999999" fill="#e0e7ff" opacity="0.55"/>
<circle cx="1128" cy="567" r="151.2" fill="#fce7f3" opacity="0.7"/>
<rect x="80" y="70" width="1040" height="490" rx="34" fill="none" stroke="#4f46e5" stroke-width="5" stroke-dasharray="14 12"/>

<g filter="url(#sh)"><rect x="110" y="130" width="980" height="400" rx="18" fill="#fff"/></g>
<path d="M110 148 q0 -18 18 -18 h944 q18 0 18 18 v34 h-980 z" fill="#f2f4f8"/>

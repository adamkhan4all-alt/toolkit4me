<text x="370" y="250" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#4338ca" text-anchor="middle">Split</text><text x="370" y="292" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#343a4c" text-anchor="middle">the pages</text><text x="370" y="322" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#343a4c" text-anchor="middle">you need</text><path d="M474 265 L496 265" stroke="#343a4c" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#ah)"/><g filter="url(#sh)"><rect x="500" y="150" width="200" height="230" rx="22" fill="#fff"/></g><circle cx="600" cy="150" r="30" fill="#4f46e5"/><text x="600" y="161" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="600" y="250" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#4338ca" text-anchor="middle">Merge</text><text x="600" y="292" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#343a4c" text-anchor="middle">into one</text><text x="600" y="322" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#343a4c" text-anchor="middle">file</text><path d="M704 265 L726 265" stroke="#343a4c" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#ah)"/><g filter="url(#sh)"><rect x="730" y="150" width="200" height="230" rx="22" fill="#fff"/></g><circle cx="830" cy="150" r="30" fill="#4f46e5"/><text x="830" y="161" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#fff" text-anchor="middle">4</text>

<text x="1060" y="250" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#4338ca" text-anchor="middle">Number</text><text x="1060" y="292" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#343a4c" text-anchor="middle">the pages</text><text x="1060" y="322" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#343a4c" text-anchor="middle"></text><g filter="url(#sh)"><rect x="330" y="420" width="540" height="64" rx="32" fill="url(#brandg)"/></g><text x="600" y="463" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">One numbered PDF per module</text>

<rect width="1200" height="520" fill="url(#bg)"/>
<circle cx="96" cy="78" r="93.6" fill="#e0e7ff" opacity="0.55"/>
<circle cx="1128" cy="468" r="124.8" fill="#fce7f3" opacity="0.7"/><text x="600" y="70" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#12142a" text-anchor="middle">From scattered files to one revision pack</text><g filter="url(#sh)"><rect x="40" y="150" width="200" height="230" rx="22" fill="#fff"/></g><circle cx="140" cy="150" r="30" fill="#4f46e5"/><text x="140" y="161" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#fff" text-anchor="middle">1</text>

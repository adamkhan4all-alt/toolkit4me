<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Diagram: convert, split, merge, tidy and number pages to build one revision pack"><title>Diagram: convert, split, merge, tidy and number pages to build one revision pack</title>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Diagram: a photographed handout is only pixels; after OCR its words become searchable, copyable text"><title>Diagram: a photographed handout is only pixels; after OCR its words become searchable, copyable text</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef2ff"/><stop offset="1" stop-color="#fdf2f8"/></linearGradient>
<linearGradient id="brandg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#db2777"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#12142a" flood-opacity="0.12"/></filter>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="24" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#343a4c"/></marker>
</defs>
<rect width="1200" height="600" fill="url(#bg)"/>
<circle cx="96" cy="90" r="108" fill="#e0e7ff" opacity="0.55"/>
<circle cx="1128" cy="540" r="144" fill="#fce7f3" opacity="0.7"/><text x="600" y="70" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#12142a" text-anchor="middle">What OCR changes</text><g filter="url(#sh)"><rect x="70" y="110" width="440" height="400" rx="22" fill="#fff"/></g><text x="290" y="160" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#12142a" text-anchor="middle">Photo of a handout</text>
<rect x="110" y="190" width="360" height="230" rx="10" fill="#e9ecf3"/><rect x="130" y="212" width="300" height="12" rx="3" fill="#8b93a7" opacity="0.75"/><rect x="136" y="240" width="280" height="12" rx="3" fill="#8b93a7" opacity="0.75"/><rect x="130" y="268" width="310" height="12" rx="3" fill="#8b93a7" opacity="0.75"/><rect x="136" y="296" width="250" height="12" rx="3" fill="#8b93a7" opacity="0.75"/><rect x="130" y="324" width="300" height="12" rx="3" fill="#8b93a7" opacity="0.75"/><rect x="136" y="352" width="220" height="12" rx="3" fill="#8b93a7" opacity="0.75"/><rect x="130" y="380" width="270" height="12" rx="3" fill="#8b93a7" opacity="0.75"/>
<text x="290" y="470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#be123c" text-anchor="middle">Pixels: can't search or copy</text><path d="M530 310 L660 310" stroke="#4f46e5" stroke-width="8" fill="none" stroke-linecap="round" marker-end="url(#ah)"/><text x="595" y="280" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#4f46e5" text-anchor="middle">OCR</text><g filter="url(#sh)"><rect x="690" y="110" width="440" height="400" rx="22" fill="#fff"/></g><text x="910" y="160" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#12142a" text-anchor="middle">Extracted text</text>
<rect x="730" y="190" width="360" height="230" rx="10" fill="#eef2ff"/>
<text x="750" y="236" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#12142a" text-anchor="start">Photosynthesis converts</text><text x="750" y="272" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#12142a" text-anchor="start">light energy into</text>
<rect x="746" y="286" width="190" height="38" rx="6" fill="#fde68a"/><text x="750" y="314" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#12142a" text-anchor="start">chemical energy</text><text x="750" y="350" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#12142a" text-anchor="start">stored in glucose.</text>
<rect x="1040" y="292" width="3" height="30" fill="#12142a"/>
<text x="910" y="470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#15803d" text-anchor="middle">Text: search, copy, quote</text>
<text x="600" y="570" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#343a4c" text-anchor="middle">Always check the extracted text against the original</text>
</svg>